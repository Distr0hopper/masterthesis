# The whole application: `docker compose up -d --build`, then open http://localhost:8080
# (login codes arrive in Mailhog at http://localhost:8025).
#
# For development with hot reload, start only the infrastructure and run the backend
# (`make run`) and frontend (`npm run dev`) locally - see CLAUDE.md:
#   docker compose up -d postgres mailhog packaging-service format-service

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend-python
    # named, so login-code-purge can run the very same image instead of building its own
    image: component-repository-backend
    ports:
      - "8000:8000" # Swagger UI at http://localhost:8000/docs
    # secrets and settings (JWT_SECRET, ...) - copy backend-python/.env.example to .env
    env_file: ./backend-python/.env
    # inside the compose network every service is reached by its name, not localhost
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      PACKAGING_SERVICE_URL: http://packaging-service:8000/api/v1
      FORMAT_SERVICE_URL: http://format-service:8000/api/v1
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      packaging-service:
        condition: service_started
      format-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  login-code-purge:
    # scheduled job: deletes expired login codes (backend-python/app/jobs/purge_login_codes.py).
    # The backend image, but instead of the API it runs the job once per interval - the
    # local stand-in for a scheduler like a Kubernetes CronJob, see docs/deployment.md
    image: component-repository-backend
    # built by the backend service above, never pulled - so start it via `make docker-up`
    # (or after the backend has been built once), not on its own on a fresh machine
    pull_policy: never
    env_file: ./backend-python/.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    # how often: LOGIN_CODE_PURGE_INTERVAL_SECONDS from backend-python/.env, 3600 (hourly) if unset
    command:
      - sh
      - -c
      - while true; do python -m app.jobs.purge_login_codes; sleep "$${LOGIN_CODE_PURGE_INTERVAL_SECONDS:-3600}"; done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: moveapps
      POSTGRES_PASSWORD: moveapps
      POSTGRES_DB: component_repository
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moveapps -d component_repository"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI - login codes land here
    restart: unless-stopped

  packaging-service:
    build: ./automated-packaging
    ports:
      - "8002:8000"
    environment:
      # Optional GitHub PAT to avoid API rate limits - set it in ./.env
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WRAPPER_IMAGE: ${WRAPPER_IMAGE:-moveapps-r-wrapper:latest}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  format-service:
    # SOS File Format Service - format labels and port compatibility. It fetches the
    # ontologies itself, e.g. https://dfg-sos.github.io/ontologies/eo-formats.owl
    image: ghcr.io/dfg-sos/file-format-service:latest
    platform: linux/amd64 # the only platform the image is published for
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
