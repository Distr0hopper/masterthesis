services:
  packaging-service:
    build: ./automated-packaging
    ports:
      - "8002:8000" # 8001 is the format-service below
    environment:
      # Optional GitHub PAT to avoid API rate limits - set it in ./.env
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WRAPPER_IMAGE: ${WRAPPER_IMAGE:-moveapps-r-wrapper:latest}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  format-service:
    # SOS File Format Service - format labels and port compatibility. It fetches the
    # ontologies itself, e.g. https://dfg-sos.github.io/ontologies/eo-formats.owl
    image: ghcr.io/dfg-sos/file-format-service:latest
    platform: linux/amd64 # the only platform the image is published for
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
