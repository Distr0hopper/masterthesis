server {
    listen 80;
    root /usr/share/nginx/html;

    # the API, under the SPA's own origin - /api/components -> backend:8000/components
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # uploads: a workflow zip may be 10 MB, plus the other parts of the form
        client_max_body_size 25m;
        # packaging a repo may take up to PACKAGING_SERVICE_TIMEOUT (120 s)
        proxy_read_timeout 180s;
    }

    # client-side routes: every path that isn't a built file is the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
