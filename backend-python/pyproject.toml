[project]
name = "backend-python"
version = "0.1.0"
description = "FastAPI port of the Component Repository backend"
readme = "README.md"
authors = [
    { name = "Julius Arzberger", email = "julius.arzberger@stud-mail.uni-wuerzburg.de" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "resend[async]>=2.35.0",
    "ruamel-yaml>=0.18",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.0",
]

[tool.uv]
package = false
